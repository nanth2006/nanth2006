name: Update profile cards

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate_cards.py"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch real GitHub data and render stats.svg / langs.svg / trophies.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a classic PAT (read:user, repo) as secret STATS_TOKEN to count private contributions
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg trophies.svg data/github-stats.json
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
