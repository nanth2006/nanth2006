name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"        # every day, 00:00 UTC
  workflow_dispatch:            # manual run button
  push:
    branches: [main]
    paths: [".github/workflows/github-snake.yml"]

permissions:
  contents: write               # needed to push to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (pink/purple palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: exactly 5 colours - 1st = no contributions, then low -> high
          outputs: |
            dist/github-snake-dark.svg?color_snake=#ff4fa3&color_dots=#1c0f2e,#4a2478,#7a3cc4,#c04fd8,#ff4fa3
            dist/github-snake.svg?color_snake=#e0157a&color_dots=#f3e9fb,#e2c4f5,#c995ee,#a066ff,#e0157a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
